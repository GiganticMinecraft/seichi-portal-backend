[config]
skip_core_tasks = true
default_to_workspace = false

[tasks.up-db]
command = "docker"
args = [
    "compose",
    "up",
    "-d"
]

# ローカル観測検証環境 (grafana/otel-lgtm) 込みで compose を起動する。
# backend 側は OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 を設定して
# 起動すると、http://localhost:3000 の Grafana からトレースを確認できる。
[tasks.up-observability]
command = "docker"
args = [
    "compose",
    "--profile",
    "observability",
    "up",
    "-d"
]

[tasks.run-server]
command = "cargo"
args = ["run", "--package", "entrypoint"]

[tasks.generate-openapi]
command = "cargo"
args = ["run", "--package", "entrypoint", "--bin", "generate-openapi"]

[tasks.check-openapi-tracked]
command = "git"
args = ["ls-files", "--error-unmatch", "docs/openapi.json"]

[tasks.check-openapi]
dependencies = ["generate-openapi", "check-openapi-tracked"]
command = "git"
args = ["diff", "--exit-code", "--", "docs/openapi.json"]

[tasks.db]
command = "docker"
args = ["exec", "-it", "mariadb", "mariadb", "-uuser", "-ppassword", "seichi_portal"]

[tasks.up]
dependencies = ["up-db", "run-server"]

[tasks.pretty]
cwd = "server"
command = "makers"
args = ["pretty"]
