[package]
name = "entrypoint"
version.workspace = true
edition = "2024"
default-run = "entrypoint"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
axum-tracing-opentelemetry = "0.39.1"
common = { path = "../common" }
hyper = { version = "1.11.1", features = ["full"] }
json-subscriber = { version = "0.3.0", features = ["tracing-opentelemetry-0-33"] }
opentelemetry = "0.32.0"
# cross ビルドの rustls 縛りに合わせ、TLS フィーチャーなし (in-cluster http://) + blocking reqwest 構成にする
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.32.1"
presentation = { path = "../presentation" }
# 継続プロファイリング (Grafana Pyroscope への push)。
# in-cluster http:// のみを想定し、このクレートからは TLS フィーチャーを有効化しない
# (ワークスペースの他依存が reqwest の TLS を有効化する分は feature unification で共存する)
pyroscope = { version = "2.1.1", default-features = false, features = ["backend-pprof-rs"] }
resource = { path = "../infra/resource" }
tokio = { workspace = true }
tower-http = { version = "0.7.0", features = ["catch-panic", "cors"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["std", "registry", "env-filter"] }
serde_json = { workspace = true }
futures = { workspace = true }
serenity = { workspace = true }
domain = { path = "../domain" }
usecase = { path = "../usecase" }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[package.metadata.cargo-udeps.ignore]
development = ["cargo-husky"]

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = false # Disable features which are enabled by default
features = ["user-hooks"]
