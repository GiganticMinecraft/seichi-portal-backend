name: Release docker images

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: image-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release eligibility
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check workspace version and release tag
        id: release
        run: |
          if ! git rev-parse "$GITHUB_SHA^" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(git show "$GITHUB_SHA^:Cargo.toml" | python3 scripts/release_version.py read -)"
          current_version="$(python3 scripts/release_version.py read Cargo.toml)"
          if [ "$previous_version" = "$current_version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cargo metadata --no-deps --format-version 1 \
            | python3 scripts/release_version.py verify-workspace "$current_version"

          tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.docker-platform }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-platform: linux/amd64
            cross-target: x86_64-unknown-linux-gnu
          - docker-platform: linux/arm64/v8
            cross-target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read Rust version
        run: echo "RUST_VERSION=$(sed -n 's/channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"
      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.cross-target }}
      - name: Build binary using cross
        uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --manifest-path Cargo.toml --target ${{ matrix.cross-target }} --release
      - name: Upload artifact to collect in next job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cross-target }}
          path: target/${{ matrix.cross-target }}/release/entrypoint

  release-all:
    name: Push docker image for all platforms
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-unknown-linux-gnu
          path: docker/artifacts/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-unknown-linux-gnu
          path: docker/artifacts/aarch64-unknown-linux-gnu
      - name: Prepare image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/seichi-portal-backend" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ github.sha }}
        run: gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes
