name: Release docker images

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: image-release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release eligibility
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Check workspace version and release tag
        id: release
        run: |
          read_workspace_version() {
            sed -n '/^\[workspace\.package\]/,/^\[/ s/^[[:space:]]*version[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*$/\1/p'
          }

          if ! git rev-parse "$GITHUB_SHA^" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(git show "$GITHUB_SHA^:Cargo.toml" | read_workspace_version)"
          current_version="$(read_workspace_version < Cargo.toml)"
          if ! printf '%s\n' "$current_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Invalid workspace version: $current_version" >&2
            exit 1
          fi
          if [ "$previous_version" = "$current_version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set -o pipefail
          errors="$(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.workspace_members as $members | .packages[] | select(.id as $id | $members | index($id)) | [.name, .version, .manifest_path] | @tsv' \
              | while IFS=$'\t' read -r name member_version manifest; do
                  if [ "$member_version" != "$current_version" ]; then
                    echo "$name has version $member_version, expected $current_version"
                  fi
                  if ! grep -qEx '[[:space:]]*version\.workspace[[:space:]]*=[[:space:]]*true[[:space:]]*' "$manifest"; then
                    echo "$manifest must declare version.workspace = true"
                  fi
                done
          )"
          if [ -n "$errors" ]; then
            echo "$errors" >&2
            exit 1
          fi

          tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Release tag $tag already exists" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.docker-platform }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-platform: linux/amd64
            cross-target: x86_64-unknown-linux-gnu
          - docker-platform: linux/arm64/v8
            cross-target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read Rust version
        run: echo "RUST_VERSION=$(sed -n 's/channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"
      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.cross-target }}
      - name: Build binary using cross
        uses: actions-rs/cargo@844f36862e911db73fe0815f00a4a2602c279505 # v1
        with:
          use-cross: true
          command: build
          args: --manifest-path Cargo.toml --target ${{ matrix.cross-target }} --release
      - name: Upload artifact to collect in next job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.cross-target }}
          path: target/${{ matrix.cross-target }}/release/entrypoint

  release-all:
    name: Push docker image for all platforms
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          - name: Set up QEMU
            uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
          - name: Login to GitHub Container Registry
            uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ github.token }}

      - parallel:
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: x86_64-unknown-linux-gnu
              path: docker/artifacts/x86_64-unknown-linux-gnu
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: aarch64-unknown-linux-gnu
              path: docker/artifacts/aarch64-unknown-linux-gnu
      - name: Prepare image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/seichi-portal-backend" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ github.sha }}
        run: gh release create "v$VERSION" --target "$TARGET" --title "v$VERSION" --generate-notes
