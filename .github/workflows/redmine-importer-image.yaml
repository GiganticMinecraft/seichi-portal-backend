name: Build Redmine importer image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/redmine-importer-image.yaml"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".sqlx/**"
      - "server/domain/**"
      - "server/errors/**"
      - "server/infra/resource/**"
      - "server/migration/**"
      - "server/redmine-importer/**"
      - "server/types/**"
      - "server/usecase/**"
      - "docker/redmine-importer.Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build for ${{ matrix.docker-platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-platform: linux/amd64
            cross-target: x86_64-unknown-linux-gnu
          - docker-platform: linux/arm64/v8
            cross-target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read Rust version
        run: echo "RUST_VERSION=$(sed -n 's/channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_ENV"
      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.cross-target }}
      # cross は GitHub Releases のビルド済みバイナリを導入する (cargo install よりも高速)
      - name: Install cross
        uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cross@0.2.5
      - name: Build binary using cross
        run: cross build --manifest-path Cargo.toml --target ${{ matrix.cross-target }} --release --locked --package redmine-importer
      - name: Upload artifact to collect in next job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.cross-target }}
          path: target/${{ matrix.cross-target }}/release/redmine-importer

  push:
    name: Push docker image for all platforms
    needs: build
    runs-on: ubuntu-latest
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          - name: Set up QEMU
            uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
          - name: Login to GitHub Container Registry
            uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
            with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ github.token }}

      - parallel:
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: x86_64-unknown-linux-gnu
              path: artifacts/x86_64-unknown-linux-gnu
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
            with:
              name: aarch64-unknown-linux-gnu
              path: artifacts/aarch64-unknown-linux-gnu

      - name: Prepare image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/seichi-portal-redmine-importer" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/redmine-importer.Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
