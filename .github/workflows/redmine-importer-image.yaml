name: Build Redmine importer image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/redmine-importer-image.yaml"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".sqlx/**"
      - "server/domain/**"
      - "server/errors/**"
      - "server/infra/resource/**"
      - "server/migration/**"
      - "server/redmine-importer/**"
      - "server/types/**"
      - "server/usecase/**"
      - "docker/redmine-importer.Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Prepare image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/seichi-portal-redmine-importer" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/redmine-importer.Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
